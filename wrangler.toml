# wrangler.toml - Cloudflare Worker deployment config
#
# Deploy:  npx wrangler deploy
# Verify:  npx wrangler tail      (REQUIRES [observability] below - without it,
#                                 console.log output is not collected and the
#                                 tail log stays empty, so you cannot confirm
#                                 that player events are arriving)
#
# Free tier: 100k requests/day, no cold starts, no credit card.

name = "numio-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------------------
# OBSERVABILITY (critical for the wrangler tail verification step)
# ---------------------------------------------------------------------------
[observability]
enabled = true

# ---------------------------------------------------------------------------
# VARIABLES (plain, non-secret)
# ---------------------------------------------------------------------------
[vars]
# Nuvio API base (every sync RPC lives under {base}/rest/v1/rpc/...)
NUVIO_BASE = "https://api.nuvio.tv"

# Nuvio profile used when the install URL does not carry `@<profile>` (1-6)
PROFILE_ID = "1"

# OPTIONAL last-resort metadata key. Not needed for normal operation: the
# addon resolves metadata from the USER'S OWN installed addons (their Nuvio
# account's addon list) before ever touching a third party. This is only a
# final fallback when the user has no meta-capable addon installed.
# NUVIO_TMDB_KEY = "your-tmdb-key"

# Optional: pin the /login endpoint (used by the site's sign-in form) to your
# GitHub Pages origin so the Worker cannot be abused as a generic Nuvio
# credential-checking oracle. Set AFTER Pages is live, e.g.:
# ALLOWED_ORIGIN = "https://vijay3695.github.io"

# ---------------------------------------------------------------------------
# SECRETS (set with:  npx wrangler secret put NUVIO_PUB_KEY)
# ---------------------------------------------------------------------------
# Nuvio's publishable client key. It ships inside every Nuvio client (same
# role as a Supabase anon key) and identifies the app, not the user.
# The default baked into worker.js works out of the box; only override this
# if Nuvio rotates it.
# NUVIO_PUB_KEY = "sb_publishable_..."
